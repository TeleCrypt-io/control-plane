name: build

on:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"
  PYTHON_VERSION: "3.12.14"
  SYNAPSE_VERSION: "1.159.0"
  SYNAPSE_IMAGE: "ghcr.io/element-hq/synapse:v1.159.0"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: telecrypt_test
          POSTGRES_PASSWORD: telecrypt_test
          POSTGRES_DB: telecrypt_test
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telecrypt_test -d telecrypt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://telecrypt_test:telecrypt_test@127.0.0.1:5432/telecrypt_test?sslmode=disable
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Require exact tool versions
        run: |
          set -euo pipefail
          [[ "$(awk '$1 == "go" { print $2; exit }' go.mod)" == "$GO_VERSION" ]]
          [[ "$(sed -n 's/^FROM \(golang:[^ ]*\) AS controlplane-build$/\1/p' Dockerfile)" == "golang:${GO_VERSION}-alpine" ]]
          [[ "$(sed -n 's/^requires = \[\"\([^\"]*\)\"\]$/\1/p' pyproject.toml)" == setuptools==84.0.0 ]]
          [[ "$SYNAPSE_IMAGE" == "ghcr.io/element-hq/synapse:v${SYNAPSE_VERSION}" ]]
      - name: Check tag source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git cat-file -t "$RELEASE_TAG")" == tag ]]
          [[ "$(git rev-parse "$RELEASE_TAG^{}")" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
      - name: Test Go services
        run: go test ./...
      - name: Vet Go services
        run: go vet ./...
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and test tier-controller wheel
        run: |
          set -euo pipefail
          test_wheelhouse=/tmp/tier-controller-test-wheelhouse
          rm -rf -- "$test_wheelhouse"
          mkdir -p "$test_wheelhouse"
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps --require-hashes \
            --dest "$test_wheelhouse" -r synapse-policy/requirements-test.txt
          python -m venv /tmp/tier-controller-venv
          python_bin=/tmp/tier-controller-venv/bin/python
          "$python_bin" -m pip install --disable-pip-version-check --no-index \
            --find-links="$test_wheelhouse" --require-hashes -r synapse-policy/requirements-test.txt
          "$python_bin" -c 'import setuptools; assert setuptools.__version__ == "84.0.0"'
          "$python_bin" -m build --no-isolation --wheel --outdir dist/tier-controller .
          timeout --signal=TERM --kill-after=5s 120s docker pull "$SYNAPSE_IMAGE"
          timeout --signal=TERM --kill-after=5s 120s docker run --rm --user 0:0 \
            --env PIP_ROOT_USER_ACTION=ignore \
            --mount "type=bind,src=$GITHUB_WORKSPACE/dist/tier-controller,dst=/wheel,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/synapse-policy/test_tier_controller.py,dst=/work/test_tier_controller.py,readonly" \
            --entrypoint python "$SYNAPSE_IMAGE" - <<'PY'
          import pathlib, site, subprocess, sys
          wheel = next(pathlib.Path('/wheel').glob('*.whl'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-index', '--no-deps', '--target', site.getsitepackages()[0], str(wheel)], check=True)
          subprocess.run([sys.executable, '/work/test_tier_controller.py'], check=True)
          PY
      - name: Check tested wheel
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/tier-controller/*.whl)
          [[ "${#wheels[@]}" -eq 1 ]]
          wheel="${wheels[0]##*/}"
          (cd dist/tier-controller && sha256sum "$wheel" >"$wheel.sha256" && sha256sum --strict --check "$wheel.sha256")
          files=(dist/tier-controller/*)
          [[ "${#files[@]}" -eq 2 ]]
          [[ "$(wc -c <"${wheels[0]}")" -le 67108864 ]]
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: controlplane-wheel-${{ github.run_id }}-${{ github.sha }}
          path: |
            dist/tier-controller/*.whl
            dist/tier-controller/*.whl.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: controlplane-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      IMAGE: ghcr.io/telecrypt-io/controlplane
      RELEASE_WHEEL: telecrypt_tier_controller-${{ github.ref_name }}-py3-none-any.whl
      RELEASE_BINDING: controlplane-${{ github.ref_name }}.digest.json
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and source
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git cat-file -t "$RELEASE_TAG")" == tag ]]
          [[ "$(git rev-parse "$RELEASE_TAG^{}")" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          printf 'ANNOTATED_TAG_SHA=%s\n' "$(git rev-parse "$RELEASE_TAG^{tag}")" >>"$GITHUB_ENV"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download tested wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "controlplane-wheel-${GITHUB_RUN_ID}-${GITHUB_SHA}" \
            --dir dist/tier-controller
      - name: Verify wheel and source version
        run: |
          set -euo pipefail
          source_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$source_version" == "$RELEASE_TAG" ]]
          shopt -s nullglob
          wheels=(dist/tier-controller/*.whl)
          [[ "${#wheels[@]}" -eq 1 ]]
          wheel="${wheels[0]##*/}"
          [[ "$wheel" == "$RELEASE_WHEEL" ]]
          (cd dist/tier-controller && sha256sum --strict --check "$wheel.sha256")
          python - "${wheels[0]}" <<'PY'
          import email, pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              metadata_name = next(n for n in names if n.endswith('.dist-info/METADATA'))
              metadata = email.message_from_bytes(archive.read(metadata_name))
              assert metadata['Name'] == 'telecrypt-tier-controller'
              assert not metadata.get_all('Requires-Dist')
              assert any(n.endswith('.dist-info/licenses/LICENSE') for n in names)
              assert any(n.endswith('.dist-info/licenses/NOTICE') for n in names)
              assert metadata['Version'] == pathlib.Path(sys.argv[1]).name.removeprefix('telecrypt_tier_controller-').split('-', 1)[0]
          PY
          for notice in LICENSE NOTICE; do test -s "$notice"; done
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          target: controlplane
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=BUSL-1.1
            org.opencontainers.image.title=TeleCrypt Controlplane
            org.opencontainers.image.description=TeleCrypt Registration, Janitor, and Plan services
            org.opencontainers.image.vendor=TeleCrypt.io
            io.telecrypt.config-contract=1
            org.telecrypt.controlplane.release=${{ env.RELEASE_TAG }}
            org.telecrypt.tier-controller.release=${{ env.RELEASE_TAG }}
      - name: Smoke-test published image
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          BUILD_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE_REF"
          for expected in \
            "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            "org.opencontainers.image.revision=$RELEASE_SHA" \
            "org.opencontainers.image.version=$RELEASE_TAG" \
            "org.opencontainers.image.licenses=BUSL-1.1" \
            "org.opencontainers.image.title=TeleCrypt Controlplane" \
            "org.opencontainers.image.description=TeleCrypt Registration, Janitor, and Plan services" \
            "org.opencontainers.image.vendor=TeleCrypt.io" \
            "io.telecrypt.config-contract=1" \
            "org.telecrypt.controlplane.release=$RELEASE_TAG" \
            "org.telecrypt.tier-controller.release=$RELEASE_TAG"; do
            key="${expected%%=*}"
            value="${expected#*=}"
            [[ "$(docker image inspect --format "{{index .Config.Labels \"$key\"}}" "$IMAGE_REF")" == "$value" ]]
          done
          [[ "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_REF")" == "991:991" ]]
          [[ "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$IMAGE_REF")" == "null" ]]
          [[ "$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE_REF")" == '["/registration"]' ]]
          published_digest="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          [[ "$published_digest" == "$BUILD_DIGEST" ]]
          registration_name=controlplane-registration-smoke
          plan_name=controlplane-plan-smoke
          cleanup() { docker rm -f "$registration_name" "$plan_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --network host --name "$registration_name" \
            --env SERVER_NAME=example.invalid "$IMAGE_REF" /registration
          docker run --detach --network host --name "$plan_name" \
          --env SERVER_NAME=example.invalid --env BILLING_ENVIRONMENT=test \
          --env MAS_OIDC_CLIENT_ID=01J00000000000000000000000 \
          --env MAS_OIDC_CLIENT_SECRET=smoke-secret \
          --env PLAN_SESSION_KEY=ssssssssssssssssssssssssssssssss \
          --env PLAN_BILLING_LINK_1=https://checkout.example.invalid/tier-1 \
          --env PLAN_BILLING_LINK_2=https://checkout.example.invalid/tier-2 \
          --env PLAN_BILLING_LINK_3=https://checkout.example.invalid/tier-3 \
          --env PLAN_BILLING_LINK_4=https://checkout.example.invalid/tier-4 \
          --env PLAN_BILLING_PORTAL_URL=https://portal.example.invalid/login \
          "$IMAGE_REF" /plan
          wait_for_status() {
            local url="$1" expected="$2" status
            for _ in $(seq 1 30); do
              status="$(curl --no-progress-meter --connect-timeout 1 --max-time 3 --output /dev/null --write-out '%{http_code}' "$url" 2>/dev/null || true)"
              [[ "$status" == "$expected" ]] && return 0
              sleep 1
            done
            return 1
          }
          if ! wait_for_status http://127.0.0.1:9009/redpill 405; then
            docker logs "$registration_name" || true
            exit 1
          fi
          if ! wait_for_status http://127.0.0.1:9012/plan/overview 200; then
            docker logs "$plan_name" || true
            exit 1
          fi
      - name: Create release assets
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          release_dir="$RUNNER_TEMP/controlplane-release"
          mkdir -p "$release_dir"
          jq -cS -n \
            --arg image "$IMAGE" --arg tag "$RELEASE_TAG" --arg source "$RELEASE_SHA" \
            --arg tag_object "$ANNOTATED_TAG_SHA" --arg digest "$IMAGE_DIGEST" \
            '{schema_version: 1, image: $image, tag: $tag, source_commit: $source, annotated_tag_sha: $tag_object, digest: $digest}' \
            >"$release_dir/$RELEASE_BINDING"
          gh release create "$RELEASE_TAG" \
            "dist/tier-controller/$RELEASE_WHEEL" "$release_dir/$RELEASE_BINDING" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" \
            --notes "Exact Controlplane release $RELEASE_TAG."
          mapfile -t assets < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          [[ "${#assets[@]}" -eq 2 ]]
          [[ "${assets[0]}" == "$RELEASE_BINDING" ]]
          [[ "${assets[1]}" == "$RELEASE_WHEEL" ]]
