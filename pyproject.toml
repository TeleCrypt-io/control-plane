[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telecrypt-tier-controller"
version = "0.5.45"
description = "TeleCrypt fail-closed Synapse capability-policy module"
requires-python = ">=3.10"
license = "LicenseRef-BUSL-1.1"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "TeleCrypt.io" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

# The project root is the package directory itself so the released wheel installs the importable
# package as ``tier_controller``.
[tool.setuptools]
packages = ["tier_controller"]
package-dir = { tier_controller = "synapse-policy" }
